<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Aplicație de învățat relieful României: hartă, lecții, fotografii și jocuri pe harta oarbă.">
<meta name="theme-color" content="#2f6b4f">
<style>html{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Relieful României</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@600;800&family=Alegreya+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: bară de navigare fixă sus + o coloană de conținut; culorile unităților sunt cele hipsometrice de pe hartă */
:root{
  --bg:#f5f6f0; --surface:#ffffff; --sunk:#eceee6; --fg:#1f2a24; --muted:#5b6a60; --line:#d9dfd4;
  --accent:#2f6b4f; --accent-soft:#e1eee5; --on-accent:#ffffff;
  --h-munte:#9a5b2e; --h-deal:#c49a2c; --h-podis:#b8873f; --h-campie:#5a9445; --h-delta:#2d7f9a;
  --map-land:#e9ead9; --map-sea:#d5e7ef;
  --ok:#2f7d4a; --bad:#b2402f;
  --i-rock:#b39a80; --i-rock2:#7d6650; --i-grass:#9cc28a; --i-sand:#e2c98f; --i-clay:#c79b72; --i-loess:#e8d59c;
  --i-water:#7fb7d6; --i-snow:#ffffff; --i-lava:#d65b3a; --i-gas:#a9d0ef; --i-salt:#f7f5ee;
  --f-display:"Alegreya",Georgia,serif; --f-body:"Alegreya Sans",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131915; --surface:#1b231e; --sunk:#161d18; --fg:#e7ece6; --muted:#9fb0a4; --line:#2e3a33;
  --accent:#7cc39c; --accent-soft:#213328; --on-accent:#10261a;
  --h-munte:#c98451; --h-deal:#d9b84f; --h-podis:#c99d5a; --h-campie:#7fbd68; --h-delta:#5cb3cf;
  --map-land:#232c26; --map-sea:#18262d;
  --ok:#6fcf8f; --bad:#f08470;
  --i-rock:#8a7360; --i-rock2:#5f4b3a; --i-grass:#5c8a4c; --i-sand:#b59a62; --i-clay:#9a7352; --i-loess:#b8a46c;
  --i-water:#3f7fa2; --i-snow:#e8eef2; --i-lava:#d65b3a; --i-gas:#6aa0c8; --i-salt:#d9d4c8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131915; --surface:#1b231e; --sunk:#161d18; --fg:#e7ece6; --muted:#9fb0a4; --line:#2e3a33;
  --accent:#7cc39c; --accent-soft:#213328; --on-accent:#10261a;
  --h-munte:#c98451; --h-deal:#d9b84f; --h-podis:#c99d5a; --h-campie:#7fbd68; --h-delta:#5cb3cf;
  --map-land:#232c26; --map-sea:#18262d;
  --ok:#6fcf8f; --bad:#f08470;
  --i-rock:#8a7360; --i-rock2:#5f4b3a; --i-grass:#5c8a4c; --i-sand:#b59a62; --i-clay:#9a7352; --i-loess:#b8a46c;
  --i-water:#3f7fa2; --i-snow:#e8eef2; --i-lava:#d65b3a; --i-gas:#6aa0c8; --i-salt:#d9d4c8; color-scheme:dark}

body{background:var(--bg);color:var(--fg);font:17px/1.55 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(1.9rem,5vw,2.6rem);font-weight:800}
h2{font-size:1.55rem}
h3{font-size:1.15rem}
p{margin:0}
button{font-family:var(--f-body)}
button:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
.brand{font:800 1.1rem var(--f-display);white-space:nowrap;cursor:pointer;background:none;border:0;color:var(--fg);padding:0}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0}
.nav::-webkit-scrollbar{display:none}
.nav button{white-space:nowrap;font:600 .92rem var(--f-body);border:0;background:transparent;color:var(--muted);border-radius:8px;padding:7px 11px;cursor:pointer}
.nav button.on{background:var(--accent-soft);color:var(--accent)}
.nav button:hover{color:var(--fg)}

main{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:22px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 72px}
.label{font:500 .72rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lead{color:var(--muted);max-width:64ch}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.stack{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.grid > *{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.note{background:var(--accent-soft);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
ul.list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:3px}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 .85rem var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:3px 10px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.dot{display:inline-block;width:11px;height:11px;border-radius:3px;flex:none}
.btn{font:600 .95rem var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 14px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.good{border-color:var(--ok);color:var(--ok)}
.btn.badb{border-color:var(--bad);color:var(--bad)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.count{font:500 .85rem var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.badge{font:500 .7rem var(--f-mono);letter-spacing:.05em;text-transform:uppercase;border-radius:4px;padding:2px 6px;background:var(--sunk);color:var(--muted)}
.badge.ok{background:var(--accent-soft);color:var(--accent)}

/* acasă */
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:center}
.hero > *{min-width:0}
@media (max-width:720px){.hero{grid-template-columns:1fr}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:480px){.stats{grid-template-columns:1fr}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}
.stat b{font:800 1.6rem var(--f-display);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.cap{cursor:pointer;border-left:5px solid var(--c)}
.cap:hover{border-color:var(--c);box-shadow:0 0 0 1px var(--c)}

/* harta */
.map svg{width:100%;height:auto;display:block}
.map .reg{fill-opacity:.42}
.map .reg.on{fill-opacity:.7}
.map .reg.dim{opacity:.35}
.play svg{cursor:crosshair}
.map .pin-you{fill:var(--bad);stroke:#fff;stroke-width:2}
.map .pin-ok{fill:var(--ok);stroke:#fff;stroke-width:2}
.map .pin-line{stroke:#1f2a24;stroke-width:2;stroke-dasharray:6 4}
.small-modes button{padding:5px 11px;font-size:.85rem}
.foto{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.foto img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;display:block;background:var(--sunk)}
.foto figcaption{font-size:.92rem;display:flex;flex-direction:column;gap:2px}
.foto figcaption span{font:500 .7rem var(--f-mono);color:var(--muted)}
.mini-fotos{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.mini-fotos .foto figcaption{font-size:.8rem}
.map-eu img{aspect-ratio:auto;object-fit:contain}
.cap.sel{box-shadow:0 0 0 2px var(--c)}

/* jocuri pe harta oarbă — paleta hărții e fixă (apă, uscat, zone), ca pe o hartă tipărită */
.jh{display:flex;flex-direction:column;gap:10px;--jh-sea:#a9cdd8;--jh-land:#d9d6c8;--jh-reg:#f1efe6;--jh-line:#3b3a36;--jh-hi:#2f6fb5;
  --jh-c1:#3f9b52;--jh-c2:#e0c234;--jh-c3:#e88b2e;--jh-c4:#cf3b2c}
.jh-bar{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;background:var(--fg);color:var(--bg);border-radius:10px;padding:8px 12px}
.jh-prog,.jh-time{font:500 .85rem var(--f-mono);font-variant-numeric:tabular-nums;border:1px solid color-mix(in srgb,var(--bg) 35%,transparent);border-radius:6px;padding:3px 8px;white-space:nowrap}
.jh-ask{text-align:center;font-size:1.05rem;min-width:0}
.jh-ask b{background:var(--bg);color:var(--fg);border-radius:6px;padding:2px 10px;font-family:var(--f-display);font-size:1.15rem}
.jh-ic{background:transparent;border:0;color:var(--bg);font-size:1.1rem;cursor:pointer;padding:2px 6px}
@media (max-width:560px){.jh-bar{grid-template-columns:auto auto auto;}.jh-ask{grid-column:1/-1;grid-row:2}}
.jh-map{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.jh-map svg{display:block;width:100%;height:auto;cursor:pointer;touch-action:manipulation}
.jh-sea{fill:var(--jh-sea)}
.jh-land{fill:var(--jh-land);stroke:#fff;stroke-width:.6}
.jh-nb{font:italic 500 13px var(--f-body);fill:#5b5f58;pointer-events:none}
.jh-r{fill:var(--jh-reg);stroke:var(--jh-line);stroke-width:.8;fill-rule:evenodd;transition:fill .15s}
.jh-r:hover{fill:#fffbe8}
.jh-mic{stroke-width:1.2}
.jh-border{fill:none;stroke:var(--jh-line);stroke-width:1.8;pointer-events:none}
.jh-riv{fill:none;stroke:#6aa6d0;stroke-width:.6;stroke-linejoin:round;pointer-events:none;opacity:.6}
.map .sub-l{fill:none;stroke:#2a2a26;stroke-width:.8;stroke-dasharray:3 2;pointer-events:none;opacity:.8}
.map .sub-t{font:600 8.5px var(--f-body);fill:#1b1b1b;stroke:#fff;stroke-width:2.5px;paint-order:stroke;pointer-events:none}
.jh-r.c1{fill:var(--jh-c1)} .jh-r.c2{fill:var(--jh-c2)} .jh-r.c3{fill:var(--jh-c3)} .jh-r.c4{fill:var(--jh-c4)}
.jh-r.hi{fill:var(--jh-hi)}
.jh-r.bad{fill:var(--jh-c4)}
.jh-lbl{font-family:var(--f-body);font-weight:700;fill:#1b1b1b;paint-order:stroke;stroke:#fff;stroke-width:4px}
.jh-toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--fg);color:var(--bg);border-radius:8px;padding:6px 12px;font-size:.95rem;max-width:90%;text-align:center}
.jh-type{display:flex;gap:8px;flex-wrap:wrap}
.jh-type input{flex:1;min-width:180px;font:500 1rem var(--f-body);padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
.learn .jh-map svg{cursor:help}
@media (prefers-reduced-motion:reduce){.jh-r{transition:none}}
.quiz-photo{max-width:640px;width:100%;margin:0 auto}
.quiz-photo img{aspect-ratio:3/2}
.notext text{display:none}
section[id]{scroll-margin-top:72px}
@media (max-width:520px){.urow .thumbs{display:none}}
.map .land{fill:var(--map-land);stroke:var(--muted);stroke-width:1.2}
.map .reg{stroke:var(--surface);stroke-width:1;cursor:pointer;opacity:.85;transition:opacity .15s}
.map .reg:hover{opacity:1}
.map .reg.on{opacity:1;stroke:var(--fg);stroke-width:2.5}
.map .reg.dim{opacity:.25}
.map text{font:600 11px var(--f-body);fill:var(--fg);paint-order:stroke;stroke:var(--map-land);stroke-width:3px;pointer-events:none}
.map text.nb{font:italic 500 12px var(--f-body);fill:var(--muted);stroke:none}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.9rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* unitate */
.unit-head{border-left:6px solid var(--c);padding-left:14px;display:flex;flex-direction:column;gap:4px}
.q4{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (max-width:640px){.q4{grid-template-columns:1fr}}
.q4 .panel{border-top:3px solid var(--c)}
.urow{display:flex;gap:12px;align-items:center;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:10px 14px}
.urow:hover{border-color:var(--c)}
.urow .grow{flex:1;min-width:0;display:flex;flex-direction:column}
.alt{font:500 .82rem var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.thumbs{display:flex;gap:4px;flex-wrap:wrap}
.thumbs .ill{width:46px}
.check{font:600 .9rem var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:8px 12px;cursor:pointer}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

/* ilustrații */
.ill svg{width:100%;height:auto;display:block;background:var(--surface);border-radius:8px}
.ill .rk{fill:var(--i-rock)} .ill .rk2{fill:var(--i-rock2)} .ill .gr{fill:var(--i-grass)} .ill .sd{fill:var(--i-sand)}
.ill .cl{fill:var(--i-clay)} .ill .ls{fill:var(--i-loess)} .ill .wt{fill:var(--i-water)} .ill .sn{fill:var(--i-snow)}
.ill .lv{fill:var(--i-lava)} .ill .gs{fill:var(--i-gas)} .ill .sa{fill:var(--i-salt);stroke:var(--i-rock2);stroke-width:1}
.ill .bg{fill:var(--surface)}
.ill .ln{fill:none;stroke:var(--fg);stroke-width:1.2;opacity:.55}
.ill .dash{stroke-dasharray:5 4;opacity:.9}
.ill text{font:500 10.5px var(--f-mono);fill:var(--fg);paint-order:stroke;stroke:var(--surface);stroke-width:3px}
.thumbs .ill text{display:none}
.tipcard .ill{border:1px solid var(--line);border-radius:8px}

/* grafic altitudini */
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;min-width:560px;height:auto}
.chart text{font:500 12px var(--f-body);fill:var(--fg)}
.chart .tick{font:500 10.5px var(--f-mono);fill:var(--muted)}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .val{font:500 11px var(--f-mono);fill:var(--muted)}
.chart g.b{cursor:pointer}

/* comparații */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;vertical-align:top;padding:8px 10px;border-top:1px solid var(--line)}
th{font:500 .72rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td:first-child{color:var(--muted);font-weight:600;white-space:nowrap}
select{font:500 1rem var(--f-body);background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}
.pick{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.pick > *{min-width:0}
@media (max-width:560px){.pick{grid-template-columns:1fr}}
.hide-ans .ans{filter:blur(6px);cursor:pointer;user-select:none}
.hide-ans .ans.shown{filter:none}
.same-l{color:var(--ok);font-weight:600}
.diff-l{color:var(--bad);font-weight:600}

/* exersare */
.modes{display:flex;flex-wrap:wrap;gap:6px}
.modes button{font:600 .9rem var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:7px 14px;cursor:pointer}
.modes button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.card{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:12px;padding:24px;min-height:230px;display:flex;flex-direction:column;justify-content:center;gap:12px;cursor:pointer;text-align:center}
.card .q{font-family:var(--f-display);font-size:1.4rem;text-wrap:balance}
.card .a{font-size:1.05rem;max-width:58ch;margin:0 auto}
.boxes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.boxes div{background:var(--sunk);border-radius:6px;padding:6px;text-align:center;font:500 .8rem var(--f-mono);color:var(--muted)}
.boxes b{display:block;font:800 1.1rem var(--f-display);color:var(--fg)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.opts button{text-align:left;font:500 1rem var(--f-body);background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:12px;cursor:pointer}
.opts button:hover{border-color:var(--accent)}
.opts button.right{border-color:var(--ok);color:var(--ok);font-weight:700}
.opts button.wrong{border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.fact{font-family:var(--f-display);font-size:1.25rem;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.quiz-ill{max-width:360px;width:100%;margin:0 auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="topbar">
  <div class="topbar-in">
    <button class="brand" data-go="acasa">Relieful României</button>
    <nav class="nav" id="nav">
      <button data-go="acasa">Acasă</button>
      <button data-go="harta">Hartă</button>
      <button data-go="lectii">Lecții</button>
      <button data-go="relief">Tipuri de relief</button>
      <button data-go="varfuri">Altitudini</button>
      <button data-go="comparatii">Comparații</button>
      <button data-go="jocuri">Jocuri pe hartă</button>
      <button data-go="exersare">Exersare</button>
    </nav>
  </div>
</header>
<main id="view"></main>

<script src="data.js"></script>
<script src="ilustratii.js"></script>
<script src="harta-romania.js"></script>
<script src="harta-europa.js"></script>
<script src="joc-harta.js"></script>
<script src="app.js"></script>

</html>
